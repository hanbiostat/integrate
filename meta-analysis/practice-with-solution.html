<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Exercise</title>
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif;">

  <!-- Practice R code -->
  <iframe
    src="topic1-interactive.html?block=practice-1"
    title="Practice R Code"
    style="display: block; width: 100%; height: 225px; border: none;">
  </iframe>

  <!-- Confirmation checkbox -->
  <label style="display: block; margin: 8px 0;">
    <input type="checkbox" id="attempted">
    I have attempted the exercise and run my R code.
  </label>

  <!-- Solution toggle -->
  <div style="margin: 8px 0;">
    <button
      id="solution-button"
      type="button"
      disabled
      style="background: none; border: none; padding: 0;
             font: bold 16px Arial, sans-serif;
             color: #888; cursor: not-allowed;">
      🔒 Show Solution
    </button>

    <span
      id="lock-message"
      style="font-size: 13px; color: #888; margin-left: 8px;">
      Complete the checkbox first
    </span>

    <div id="solution-content" hidden>
      <iframe
        id="solution-frame"
        title="Solution R Code"
        style="display: block; width: 100%; height: 300px;
               border: none; margin-top: 12px;">
      </iframe>
    </div>
  </div>

  <script>
    const checkbox = document.getElementById("attempted");
    const button = document.getElementById("solution-button");
    const message = document.getElementById("lock-message");
    const content = document.getElementById("solution-content");
    const frame = document.getElementById("solution-frame");

    checkbox.addEventListener("change", function () {
      button.disabled = !checkbox.checked;

      if (checkbox.checked) {
        button.style.color = "#222";
        button.style.cursor = "pointer";
        button.textContent = "▶ Show Solution";
        message.hidden = true;
      } else {
        button.style.color = "#888";
        button.style.cursor = "not-allowed";
        button.textContent = "🔒 Show Solution";
        message.hidden = false;
        content.hidden = true;
      }
    });

    button.addEventListener("click", function () {
      content.hidden = !content.hidden;

      if (!content.hidden) {
        button.textContent = "▼ Hide Solution";

        if (!frame.getAttribute("src")) {
          frame.src = "topic1-interactive.html?block=solution-1";
        }
      } else {
        button.textContent = "▶ Show Solution";
      }
    });
  </script>

</body>
</html>
